<!DOCTYPE html>
<html>
<head><title>Compress pinkblossom2</title></head>
<body>
<h3>Memproses kompresi pinkblossom2.png...</h3>
<canvas id="c" style="display:none;"></canvas>
<p id="st">Loading gambar...</p>
<script>
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = '/assets/transisi/pinkblossom2.png';
  img.onload = () => {
    const c = document.getElementById('c');
    const targetW = 480;
    const targetH = Math.round(img.height * (targetW / img.width));
    c.width = targetW;
    c.height = targetH;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, targetW, targetH);
    c.toBlob((blob) => {
      const reader = new FileReader();
      reader.onloadend = () => {
        fetch('/tools/save-compressed.html', {
          method: 'POST',
          body: JSON.stringify({ data: reader.result })
        }).then(() => {
          document.getElementById('st').textContent = 'Selesai! Ukuran terkompresi: ' + Math.round(blob.size / 1024) + ' KB. File otomatis terupdate.';
        }).catch(() => {
          document.getElementById('st').textContent = 'Selesai render di canvas (' + Math.round(blob.size / 1024) + ' KB).';
        });
      };
      reader.readAsDataURL(blob);
    }, 'image/png');
  };
</script>
</body>
</html>
